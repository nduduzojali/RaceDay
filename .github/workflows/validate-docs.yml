name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check required files exist in /docs
        run: |
          missing=0

          if [ ! -f "docs/EndpointPlan.md" ]; then
            echo "ERROR: docs/EndpointPlan.md is missing."
            missing=1
          fi

          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "ERROR: No .sql file found in docs."
            missing=1
          fi

          if ! ls docs/ERD* 1> /dev/null 2>&1; then
            echo "ERROR: No ERD file found in docs."
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          echo "All required files found in docs folder."

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ] && [ ! -f "ReadMe.md" ]; then
            echo "ERROR: README.md is missing from the repository root."
            exit 1
          fi
          echo "README found."